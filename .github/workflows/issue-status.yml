name: Issue status

# The event-driven half of the status machine. The `issue-status` skill owns the
# two transitions only an agent can observe (`start` and `block`); everything
# below is driven by GitHub events instead, because a workflow still fires when
# a human opens the PR, when an agent dies mid-task, or when someone merges from
# the web UI. A board that lies is worse than no board.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-status-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync status labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const STATUSES = [
              "status:draft",
              "status:approved",
              "status:in-progress",
              "status:review",
              "status:completed",
            ];
            const { owner, repo } = context.repo;

            /** Every status label on an issue. More than one means drift. */
            async function currentStatuses(issue_number) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number });
              const found = data.labels
                .map((l) => (typeof l === "string" ? l : l.name))
                .filter((n) => STATUSES.includes(n));
              if (found.length > 1) {
                core.warning(`#${issue_number} had ${found.length} status labels (${found.join(", ")}); collapsing to one.`);
              }
              return found;
            }

            /**
             * Swap to `target`, removing every other status label first so the
             * mutual-exclusion invariant holds. `from` optionally restricts the
             * move: pass a list and the issue is left alone if it is elsewhere,
             * which is what stops a merged PR marking an unapproved spec done.
             */
            async function setStatus(issue_number, target, from) {
              const present = await currentStatuses(issue_number);
              const current = present[0] ?? null;
              if (present.length === 1 && current === target) return;
              // Gate on ANY present status, so a drifted issue is not moved on
              // the strength of a stale second label.
              if (from && !present.some((s) => from.includes(s))) {
                core.info(`#${issue_number}: status is ${current ?? "unset"}, not in [${from}] — leaving it alone.`);
                return;
              }
              for (const label of present) {
                if (label === target) continue;
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label })
                  .catch(() => {});
              }
              if (present.includes(target)) {
                core.info(`#${issue_number}: already ${target}, extra labels removed.`);
                return;
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [target] });
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `status: \`${current ?? "unset"}\` → \`${target}\` — set automatically by \`${context.eventName}\`.`,
              });
              core.info(`#${issue_number}: ${current ?? "unset"} -> ${target}`);
            }

            /** Issues a PR body says it closes. */
            function closedBy(body) {
              const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
              return [...new Set([...(body ?? "").matchAll(re)].map((m) => Number(m[1])))];
            }

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              const refs = closedBy(pr.body);
              if (refs.length === 0) {
                core.notice("PR body has no `Closes #N`, so no issue status was moved.");
              }
              for (const n of refs) {
                await setStatus(n, "status:review", ["status:approved", "status:in-progress"]);
              }
            }

            if (context.eventName === "pull_request_review") {
              if (context.payload.review.state !== "changes_requested") return;
              for (const n of closedBy(context.payload.pull_request.body)) {
                await setStatus(n, "status:in-progress", ["status:review"]);
              }
            }

            if (context.eventName === "issues") {
              const issue = context.payload.issue;
              // Closed as "not planned" is abandonment, not completion. And an
              // issue closed straight from draft/approved never shipped, so it
              // keeps whatever status it had.
              if (issue.state_reason === "not_planned") return;
              await setStatus(issue.number, "status:completed", [
                "status:review",
                "status:in-progress",
              ]);
            }

name: CI

on:
  pull_request:
  # Every branch, not just `main`. PRs live on the platanus-hack repo, whose
  # NEON_API_KEY cannot be set -- so `neon branch` 401s there and every test
  # job skips. The real suite runs on the personal mirror, which receives the
  # same commits by push but never sees a `pull_request` event. Scoped to
  # `main`, that mirror only ever validated code *after* it was merged.
  # A branch push is the only trigger that reaches it in time to matter.
  #
  # Cost: on platanus-hack a PR branch now runs twice (push + pull_request),
  # since `concurrency` groups them under different refs. Both die at the 401
  # in ~20s, so this is cheaper than merging blind.
  push:
    branches: ["**"]

# Cancel a running pipeline when the same ref is pushed again. During a 36h
# crunch with three people pushing, this is the difference between useful
# feedback and a queue of stale red checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- fast checks, all fanning out from the same cached install --------------

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  biome:
    name: biome (format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run check

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Only high and critical. Anything lower is noise we would learn to ignore.
      - run: pnpm audit --audit-level=high

  db-check:
    name: drizzle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `drizzle-kit check` diffs the committed migrations against
      # `drizzle/meta/` and never opens a connection, so this gate deliberately
      # gets no database at all: a corrupt migration history is caught before
      # any branch is created for it.
      - run: pnpm run db:check

  # -- the database every test in this run sees -------------------------------
  #
  # One PII-free branch, `ci-base`, is the parent of everything automated;
  # `production` is never a parent (docs/domain.md §8, D9). A pull request gets
  # `preview/pr-<n>` (reset to parent when it already existed, so a rewritten
  # migration never meets a stale schema); a push to main gets an ephemeral
  # `ci/main-<run_id>` that `neon-branch-delete` removes afterwards.
  #
  # Only the branch NAME is published. Actions drops any job output that
  # contains a masked value, and the action masks the branch password -- so
  # every consumer re-invokes create-branch-action with that name (which
  # returns the existing branch) and reads the URL as a step output instead.
  #
  # Needs NEON_API_KEY (secret) and NEON_PROJECT_ID (variable); see docs/ci.md.
  # Without them this job skips its own steps and stays GREEN, the same way the
  # deploy jobs skip without VERCEL_TOKEN: the branch is an enhancement, never a
  # gate. A red job here would take `unit` and `e2e` down with it -- Actions
  # skips every dependent of a failed need -- and a repo that runs no tests is
  # worse than one that runs them without a database, where the database-backed
  # suites skip themselves with a visible notice (docs/domain.md §8).

  neon-branch:
    name: neon branch
    runs-on: ubuntu-latest
    outputs:
      # Same expression as the create step's `branch_name` below, on purpose:
      # a job output cannot read a job-level `env`, and pointing the create
      # step at another step's output would hide which branch this is.
      branch_name: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.number) || format('ci/main-{0}', github.run_id) }}
    steps:
      # A secret is unreadable in a job-level `if:`, so the gate is a step --
      # the same pattern the deploy jobs below use for VERCEL_TOKEN.
      - name: Are the Neon settings configured?
        id: gate
        run: echo "ready=${{ secrets.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Explain the skip
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo "::notice title=No database branch::NEON_API_KEY (secret) and NEON_PROJECT_ID (variable) are not both set, so this run gets no Neon branch. Every test job still runs; the suites that need a database skip themselves. See docs/ci.md."

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: ./.github/actions/setup
        if: steps.gate.outputs.ready == 'true'

      - name: Create or reuse the branch
        if: steps.gate.outputs.ready == 'true'
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.number) || format('ci/main-{0}', github.run_id) }}

      - name: Reset a reused branch to its parent
        # `created` is the string 'false' only when the branch already existed
        # -- a re-pushed PR. A freshly created branch is already at the parent,
        # and a SKIPPED create step leaves the output empty, so this needs no
        # gate of its own: no branch, no reset.
        if: steps.branch.outputs.created == 'false'
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}
          parent: true

      # drizzle-kit reads process.env, so an `env:` block on the step is all
      # `db:migrate` needs to point at this branch. The URL is empty exactly
      # when the create step was skipped, which is the one case these two must
      # not run: migrating "nothing" would fail the job and skip the tests.
      - name: Apply migrations
        if: steps.branch.outputs.db_url_pooled != ''
        run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}

      - name: Seed the demo room
        if: steps.branch.outputs.db_url_pooled != ''
        run: pnpm run db:seed
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}

  neon-branch-delete:
    name: delete the CI branch
    # Only pushes create an ephemeral `ci/main-<run_id>`; a PR branch outlives
    # the run and is deleted by neon-branch-cleanup.yml when the PR closes.
    # `always()` so a red test still returns the branch to the plan's quota.
    if: always() && github.event_name == 'push'
    needs: [neon-branch, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Is there a branch to delete?
        id: gate
        run: echo "ready=${{ secrets.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

      # Deliberately not gated on neon-branch succeeding: a run that died after
      # creating the branch is exactly the one that must still return it to the
      # plan's quota. `continue-on-error` for the mirror case -- a branch that
      # was never created is nothing to clean up, not a broken build.
      - uses: neondatabase/delete-branch-action@v3
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ needs.neon-branch.outputs.branch_name }}

  # -- unit tests + coverage comment -----------------------------------------

  unit:
    name: unit tests
    # `needs` alone would make the branch a gate: Actions skips every dependent
    # of a job that was skipped or failed, and a skipped `unit` is a PR that can
    # merge having run no tests at all. `!cancelled()` overrides that -- the
    # tests run whatever neon-branch did -- while a FAILED neon-branch (a broken
    # migration) still stops them, because its branch is not a database anyone
    # should be testing against.
    if: ${{ !cancelled() && needs.neon-branch.result != 'failure' }}
    needs: [neon-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Is there a branch for this run?
        id: gate
        run: echo "ready=${{ secrets.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != '' && needs.neon-branch.outputs.branch_name != '' }}" >> "$GITHUB_OUTPUT"

      # Returns the branch neon-branch already migrated -- same name, same
      # parent -- because the URL cannot travel as a job output.
      - name: Resolve the branch URL
        if: steps.gate.outputs.ready == 'true'
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ${{ needs.neon-branch.outputs.branch_name }}

      # Two runs of the same command, never both: with a branch, the integration
      # suites under src/lib/adapters/db/ must run and a missing database is a
      # failure (DB_REQUIRED, docs/domain.md §8); without one they skip
      # themselves with their notice and the rest of the suite still gates the
      # PR. Setting DB_REQUIRED unconditionally would turn "no Neon settings"
      # into a red suite, which is the gate this job must not be.
      - name: Unit tests against the run's branch
        if: steps.db.outputs.db_url_pooled != ''
        run: pnpm run test:cov
        env:
          DB_REQUIRED: "1"
          DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}

      - name: Unit tests without a database
        if: steps.db.outputs.db_url_pooled == ''
        run: |
          echo "::notice title=No database for the unit tests::This run has no Neon branch, so the integration suites under src/lib/adapters/db/ skip themselves. See docs/ci.md."
          pnpm run test:cov

      # Report-only, no threshold. A coverage gate in a 36h build either blocks
      # a legitimate PR at hour 30 or gets lowered until it asserts nothing.
      - name: Comment coverage on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "coverage/coverage-summary.json";
            if (!fs.existsSync(path)) {
              core.info("No coverage summary produced; skipping comment.");
              return;
            }
            const { total } = JSON.parse(fs.readFileSync(path, "utf8"));
            const pct = (k) => `${total[k].pct}% (${total[k].covered}/${total[k].total})`;
            const marker = "<!-- dipia-coverage -->";
            const body = [
              marker,
              "### Coverage — `src/lib/**`",
              "",
              "| Metric | Covered |",
              "| --- | --- |",
              `| Statements | ${pct("statements")} |`,
              `| Branches | ${pct("branches")} |`,
              `| Functions | ${pct("functions")} |`,
              `| Lines | ${pct("lines")} |`,
              "",
              "_Report only — no threshold gates this PR. Scoped to `src/lib/**`;",
              "UI coverage from unit tests would be a vanity metric._",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const mine = existing.find((c) => c.body?.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # -- heavier checks ---------------------------------------------------------

  build:
    name: next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build

  e2e:
    name: playwright e2e
    # Same reasoning as `unit`: the branch is an enhancement, so a skipped
    # neon-branch must not skip the browser suite too. See that job's comment.
    if: ${{ !cancelled() && needs.neon-branch.result != 'failure' }}
    needs: [neon-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Is there a branch for this run?
        id: gate
        run: echo "ready=${{ secrets.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != '' && needs.neon-branch.outputs.branch_name != '' }}" >> "$GITHUB_OUTPUT"

      - name: Resolve the branch URL
        if: steps.gate.outputs.ready == 'true'
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ${{ needs.neon-branch.outputs.branch_name }}

      # Browsers are ~95MB; cache them against the installed Playwright version
      # so we only pay the download when the dependency actually moves.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install system deps for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # GitHub sets CI=true, which makes the visual snapshot assertions skip
      # themselves. Playwright namespaces snapshots by platform (-darwin.png)
      # and Linux renders fonts differently, so all 18 baselines would fail here
      # with no real regression. See docs/testing.md for the Docker recipe that
      # generates Linux baselines if we ever want them gating.
      #
      # Playwright boots the dev server itself (playwright.config.ts), as a
      # child of this step -- so it inherits DATABASE_URL from here and the app
      # under test reads the same branch global-setup wrote the room into.
      #
      # Two runs of the same command, never both. With a branch, e2e/global-
      # setup.ts creates the `e2e-<run>` room the intake specs register into and
      # a missing database is a failure, not a green run over specs that never
      # loaded (DB_REQUIRED). Without one, global-setup prints its warning and
      # the DB-backed specs skip themselves (PR #24) while the page-only safety
      # specs still run -- which is a real check, unlike a skipped job.
      - name: Playwright against the run's branch
        if: steps.db.outputs.db_url_pooled != ''
        run: pnpm run test:e2e
        env:
          DB_REQUIRED: "1"
          DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}

      - name: Playwright without a database
        if: steps.db.outputs.db_url_pooled == ''
        run: |
          echo "::notice title=No database for the e2e run::This run has no Neon branch, so the specs that register into the e2e room skip themselves. See docs/ci.md."
          pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # -- production ------------------------------------------------------------
  #
  # The only job in this pipeline that can see the production connection
  # string, and the only path by which production's schema ever changes. It
  # needs EVERY gate: a gate this job does not wait on is a migration that can
  # outrun a failing check.
  #
  # It FAILS rather than skips when the secret is missing. The deploy jobs skip
  # gracefully because a repo without VERCEL_TOKEN simply does not deploy; a
  # production deploy that silently skipped its migration is worse than a red
  # main, because the next request hits a table that is not there.

  migrate-production:
    name: migrate production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, biome, audit, db-check, unit, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Refuse to migrate without DATABASE_URL_PRODUCTION
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=Missing secret::DATABASE_URL_PRODUCTION is not set. Add it under Settings > Secrets and variables > Actions (see docs/ci.md) -- production is not migrated and this run stops here." >&2
            exit 1
          fi
          echo "DATABASE_URL_PRODUCTION is set; applying migrations to production."

      - name: Apply migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Seed the demo room
        run: pnpm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

  # -- deploy ----------------------------------------------------------------
  #
  # Vercel's Git integration needs its GitHub App installed on the
  # platanus-hack org, which only the organisers can do -- so the org repo cannot
  # be "imported" in the Vercel dashboard. Deploying from CI with a token sidesteps
  # that entirely: Vercel becomes a deploy target of the pipeline rather than a
  # GitHub-integrated app, and no mirror repo is needed.
  #
  # The personal fork we actually deploy from CAN install the App, and did -- so
  # pushes to main were being deployed twice: once by Vercel on its own (ungated,
  # ignoring every job below) and once by this pipeline, racing for the alias.
  # vercel.json sets git.deploymentEnabled.main = false to switch the Git
  # integration's production deploys off, leaving this job as the only path to
  # production. Preview deploys from the integration are unaffected.
  #
  # Required configuration. Until VERCEL_TOKEN exists these jobs succeed with every
  # step skipped, so CI stays green rather than being red while waiting on setup.
  #
  #   VERCEL_TOKEN       vercel.com/account/tokens            (Actions secret)
  #   VERCEL_ORG_ID      `orgId` from .vercel/project.json    (Actions variable)
  #   VERCEL_PROJECT_ID  `projectId` from the same file       (Actions variable)
  #
  # This deploys on a Hobby (personal) scope. Note that Vercel issues team_-prefixed
  # ids for personal scopes too, so a VERCEL_ORG_ID of team_... is correct here --
  # it is the id of "<your username>'s projects", not of a real team. Choose your
  # own username, not a team, when `vercel link` prompts for a scope.

  deploy-preview:
    name: deploy preview
    if: github.event_name == 'pull_request'
    needs: [typecheck, biome, unit, build, neon-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Are Vercel secrets configured?
        id: gate
        run: echo "ready=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Explain the skip
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo "::notice title=Deploy skipped::VERCEL_TOKEN is not set. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets to enable preview deploys."

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: ./.github/actions/setup
        if: steps.gate.outputs.ready == 'true'

      - name: Are the Neon settings configured?
        id: neon
        run: echo "ready=${{ secrets.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != '' && needs.neon-branch.outputs.branch_name != '' }}" >> "$GITHUB_OUTPUT"

      # A preview with no database would be a deploy of pages that all fail on
      # their first query -- and `vercel deploy -e KEY=` with an empty value is
      # a CLI error, not an empty variable. So this half of the job skips the
      # same way the whole job skips without VERCEL_TOKEN: green, with a notice.
      - name: Explain the preview skip
        if: steps.gate.outputs.ready == 'true' && steps.neon.outputs.ready != 'true'
        run: |
          echo "::notice title=Preview deploy skipped::This run has no Neon branch, so there is no per-PR database for a preview to read. Add NEON_API_KEY and NEON_PROJECT_ID (docs/ci.md)."

      - name: Resolve the branch URL
        if: steps.gate.outputs.ready == 'true' && steps.neon.outputs.ready == 'true'
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ${{ needs.neon-branch.outputs.branch_name }}

      # `-e` sets the deployment's RUN-TIME environment, so this preview talks
      # to the PR's own branch without the Vercel Preview environment ever
      # holding a database URL -- which is what keeps a preview from reaching
      # the room's real data (docs/domain.md §5, D9).
      - name: Deploy to Vercel (preview)
        if: steps.gate.outputs.ready == 'true' && steps.db.outputs.db_url_pooled != ''
        id: deploy
        run: |
          pnpm dlx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@latest deploy --prebuilt -e DATABASE_URL="$DATABASE_URL" --token="$VERCEL_TOKEN" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}

      - name: Comment the preview URL
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const marker = "<!-- dipia-preview -->";
            const body = `${marker}\n### Preview deploy\n\n${url}\n\n\`/design\` → ${url}/design`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const mine = existing.find((c) => c.body?.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy-production:
    name: deploy production
    # A migration that FAILED must stop the deploy -- production's schema is
    # then unknown. A migration that was merely SKIPPED must not: main would
    # stop deploying entirely the first time anything upstream of it skipped,
    # which is a silent outage rather than a caught mistake.
    #
    # `!cancelled()` is what allows a skipped need through -- and it also turns
    # off Actions' implicit "every need succeeded", so each gate is spelled out
    # here instead of being inherited transitively through migrate-production.
    # Dropping one would be a production deploy that outran a red check.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.migrate-production.result != 'failure' && needs.typecheck.result == 'success' && needs.biome.result == 'success' && needs.audit.result == 'success' && needs.db-check.result == 'success' && needs.unit.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' }}
    needs: [migrate-production, typecheck, biome, audit, db-check, unit, build, e2e]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Are Vercel secrets configured?
        id: gate
        run: echo "ready=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Explain the skip
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo "::notice title=Deploy skipped::VERCEL_TOKEN is not set. Production deploys are inactive."

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: ./.github/actions/setup
        if: steps.gate.outputs.ready == 'true'

      - name: Deploy to Vercel (production)
        if: steps.gate.outputs.ready == 'true'
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
